[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "path-containment"
version = "0.1.0"
description = "Keep paths inside a directory: safe joins, archive member names, filenames"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["path", "security", "zip-slip", "traversal", "sanitise", "archive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sandeshbagmare/path-containment"
Issues = "https://github.com/sandeshbagmare/path-containment/issues"
Changelog = "https://github.com/sandeshbagmare/path-containment/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/path_containment"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
